<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<meta name="theme-color" content="#0f1c15"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="CMS Traitors"/>
<link rel="icon" href="icon.svg" type="image/svg+xml"/>

<title>CMS Traitors</title>
<style>:root{--bg:#0a100d;--panel:#121a15;--card:#18221b;--line:#34463a;--text:#f5f1e7;--muted:#b9b3a4;--gold:#c6a15b;--green:#284936;--red:#7b2727;--dead:#4a4a4a}
*{box-sizing:border-box}body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:radial-gradient(circle at top,#183024 0,#0a100d 45%);color:var(--text);min-height:100vh}
button,input,select{font:inherit}button{cursor:pointer}button:disabled{opacity:.45;cursor:not-allowed}
.app{max-width:1200px;margin:0 auto;padding:18px}.hero{display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:16px}.brand h1{margin:0;font-family:Georgia,serif;letter-spacing:.08em;font-size:clamp(28px,5vw,44px);color:#dcc28b}.brand small{color:var(--muted)}
.top-actions{display:flex;gap:8px;flex-wrap:wrap}.btn,.select,.input{border:1px solid var(--line);background:#101812;color:var(--text);border-radius:12px;padding:11px 13px}.btn.primary{background:var(--gold);color:#15100a;border-color:var(--gold);font-weight:700}.btn.danger{background:#2a1414;border-color:#6b2f2f}.btn.green{background:#173222;border-color:#315e42}.btn.active{outline:2px solid var(--gold)}
.stats{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px;margin-bottom:14px}.stat{background:rgba(18,26,21,.9);border:1px solid var(--line);border-radius:14px;padding:12px}.stat span{display:block;color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.08em}.stat strong{display:block;margin-top:4px;font-size:25px}
.nav{display:flex;gap:8px;flex-wrap:wrap;padding-bottom:5px;margin-bottom:14px}.nav .btn{white-space:nowrap}.panel{background:rgba(14,21,16,.88);border:1px solid var(--line);border-radius:16px;padding:14px}.hidden{display:none!important}.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:end;margin-bottom:14px}.field{display:flex;flex-direction:column;gap:5px;min-width:170px;flex:1}.field label{color:var(--muted);font-size:12px}
.player-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}.player{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;min-width:0}.player.dead{filter:grayscale(.7);opacity:.62}.player h3{margin:0 0 4px;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.meta{color:var(--muted);font-size:12px}.secret{margin-top:6px;color:#e5c477;font-size:12px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:10px}.actions .btn{padding:8px 7px;font-size:12px}
.armoury{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:7px}.env{min-height:50px;border-radius:10px;border:1px solid var(--line);background:#121b15;color:var(--text);position:relative}.env.shield:after{content:'🛡️';position:absolute;right:3px;top:2px;font-size:12px}.env.taken{text-decoration:line-through;opacity:.35}.share-header{text-align:center;padding:18px}.share-header h2{font-family:Georgia,serif;letter-spacing:.14em;color:#dcc28b;margin:0;font-size:34px}.share-wall{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}.share-card{min-height:110px;border:1px solid var(--line);background:#172019;border-radius:12px;padding:12px;display:flex;flex-direction:column;justify-content:center;text-align:center;position:relative;overflow:hidden}.share-card.out{background:#151515;opacity:.62}.share-card.murdered::before,.share-card.murdered::after{content:'';position:absolute;left:8%;top:48%;width:84%;height:9px;background:#8f3131;border-radius:999px;box-shadow:0 2px 0 rgba(210,85,85,.22),0 -2px 0 rgba(80,10,10,.28);z-index:2;opacity:.94}.share-card.murdered::before{transform:rotate(35deg)}.share-card.murdered::after{transform:rotate(-35deg)}.share-card.murdered strong,.share-card.murdered span{position:relative;z-index:1}.share-card strong{font-size:18px}.share-card span{margin-top:5px;color:var(--muted);font-size:12px}.share-banner{margin:0 0 14px;background:linear-gradient(90deg,#172018,#2a1717,#172018);border:1px solid #5a4430;border-radius:14px;padding:18px;text-align:center}.share-banner .big{font-family:Georgia,serif;font-size:28px;color:#e1c583;letter-spacing:.06em}.share-banner .sub{color:var(--muted);margin-top:4px}
.log{display:flex;flex-direction:column;gap:8px}.log-item{padding:10px;border:1px solid var(--line);border-radius:10px;background:#121a15;display:flex;gap:10px;align-items:flex-start;justify-content:space-between}.log-copy{min-width:0;flex:1}.log-item time{display:block;color:var(--muted);font-size:11px;margin-bottom:4px}.log-delete{flex:0 0 auto;padding:6px 9px;font-size:12px}.notes-list{display:grid;gap:8px}.note-item{border:1px solid var(--line);border-radius:10px;background:#121a15;padding:10px}.note-item .note-head{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-bottom:5px}.note-item .note-date{color:#dfc487;font-size:12px}.note-item .note-player{color:var(--muted);font-size:12px}.textarea{min-height:100px;resize:vertical}.vote-row{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;margin:7px 0}.vote-tally{margin-top:14px;display:grid;gap:7px}.tally{display:flex;justify-content:space-between;border:1px solid var(--line);padding:9px 10px;border-radius:10px}.wildcards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.wild{padding:12px;background:#171b18;border:1px solid var(--line);border-radius:12px}.wild h3{margin:0 0 5px;color:#dfc487}.wild p{margin:0;color:var(--muted);font-size:13px}.wild .btn{margin-top:10px;width:100%}.notice{padding:10px 12px;border-radius:10px;background:#161d18;border:1px solid var(--line);color:var(--muted);font-size:13px}
.modalback{position:fixed;inset:0;background:rgba(0,0,0,.72);display:flex;align-items:center;justify-content:center;padding:18px;z-index:10}.modal{width:min(520px,100%);background:#111a14;border:1px solid #4f6656;border-radius:16px;padding:16px}.modal h2{margin-top:0}.modal .row{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}
.authgate{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:radial-gradient(circle at top,#183024 0,#0a100d 50%)}.authbox{width:min(460px,100%);border:1px solid var(--line);background:rgba(15,24,18,.96);border-radius:18px;padding:22px}.authbox h1{font-family:Georgia,serif;color:#dcc28b;letter-spacing:.1em;margin:0 0 4px}.authbox p{color:var(--muted);margin:0 0 18px}.authbox .field{margin-top:10px}.autherr{min-height:20px;color:#f1a3a3;font-size:13px;margin-top:10px}.syncpill{border:1px solid var(--line);border-radius:999px;padding:8px 10px;font-size:12px;color:var(--muted);background:#101812}.syncpill.ok{color:#b9e4c5;border-color:#315e42}.syncpill.bad{color:#f1a3a3;border-color:#6b2f2f}
@media(max-width:900px){.stats{grid-template-columns:repeat(3,1fr)}.player-grid{grid-template-columns:repeat(2,1fr)}.share-wall{grid-template-columns:repeat(3,1fr)}.armoury{grid-template-columns:repeat(6,1fr)}}
@media(max-width:540px){.app{padding:12px}.stats{grid-template-columns:repeat(2,1fr)}.player-grid{grid-template-columns:1fr}.share-wall{grid-template-columns:repeat(2,1fr)}.armoury{grid-template-columns:repeat(5,1fr)}.wildcards{grid-template-columns:1fr}.vote-row{grid-template-columns:1fr 1fr}.vote-row button{grid-column:1/-1}.stat strong{font-size:21px}}
@media print{body{background:#fff;color:#111}.hero,.stats,.nav,.toolbar,#hostOnlyNote{display:none!important}.panel{border:none;background:#fff}.share-card{background:#fff;color:#111}.share-card.out{background:#ddd}.share-header h2{color:#111}}</style>

</head>
<body>
<div id="authGate" class="authgate">
  <form id="loginForm" class="authbox">
    <h1>CMS TRAITORS</h1>
    <p>Host Console • private sign-in</p>
    <div class="field"><label>Email</label><input id="loginEmail" class="input" type="email" autocomplete="username" required/></div>
    <div class="field"><label>Password</label><input id="loginPassword" class="input" type="password" autocomplete="current-password" required/></div>
    <button id="loginBtn" class="btn primary" type="submit" style="width:100%;margin-top:14px">Sign in</button>
    <div id="authError" class="autherr"></div>
  </form>
</div>
<div class="app hidden" id="app">
<header class="hero"><div class="brand"><h1>CMS TRAITORS</h1><small>Host Console</small></div><div class="top-actions"><span id="syncPill" class="syncpill">Local</span><select id="gameSelect" class="select"><option value="A">Game A</option><option value="B">Game B</option></select><button id="publicMode" class="btn">📺 Share View</button><button id="signOutBtn" class="btn">Sign out</button></div></header>
<section class="stats"><div class="stat"><span>Alive</span><strong id="aliveStat">0</strong></div><div class="stat"><span>Faithful</span><strong id="faithfulStat">0</strong></div><div class="stat"><span>Traitors</span><strong id="traitorStat">0</strong></div><div class="stat"><span>Shields Active</span><strong id="shieldStat">0</strong></div><div class="stat"><span>Pot</span><strong id="potStat">TBD</strong></div><div class="stat"><span>Week</span><strong id="weekStat">1</strong></div></section>
<nav class="nav" id="nav"></nav>
<div id="hostOnlyNote" class="notice">Host-only app. Public screenshots should be taken from Share View, which hides secret roles, Shield owners and future actions.</div>
<section id="panel" class="panel" style="margin-top:12px"></section>
</div>
<div id="modalRoot"></div>

<script>(()=>{
const C=window.CMS={};
C.TABS=['Dashboard','Players','Player Import','Round Table','Armoury','Wildcards','Host Notes','Story Studio','Game Log','Share View'];
C.WILDS=[['Poisoned Message','Send an internal message with a secret phrase. A reply completes the murder.'],['Fatal Selfie','Get a photo/selfie with the target before the deadline.'],['Poisoned Chalice','Get the target to accept a designated harmless object/token.'],['Say My Name','Get the target to naturally say a secret word or phrase.'],['Marked for Death','Secretly place a designated token/card into the target’s possession.'],['Death List','Nominate three players. A mission saves two; the third is murdered.'],['Secret Shield','A Shield is won but the winner stays secret.'],['Dagger','One player’s next Round Table vote counts twice.'],['Recruitment','A surviving Traitor recruits a Faithful.'],['No Body Found','Announce a murder but delay the identity reveal.'],['Secret Faithful Mission','Give an innocent Faithful a suspicious mini-task.'],['Double Bluff','Announce a twist but hide its exact effect until resolved.']];
const URL='https://icmswuaidofxxdqiovsj.supabase.co',KEY='sb_publishable_vk6oqfLo2cClWhbHReLKJQ_oaLamxF8',SK='cms-traitors-supabase-session',LK='cms-traitors-v4';
const uuid=()=>crypto.randomUUID?.()||String(Date.now()+Math.random());
C.esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
C.today=()=>{let d=new Date();return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')};
function players(n=30){return Array.from({length:n},(_,i)=>({id:uuid(),name:`Player ${String(i+1).padStart(2,'0')}`,role:i<2?'Traitor':'Faithful',status:'Alive',shield:false,revealedRole:null,notes:''}))}
function armoury(){let a=Array.from({length:60},(_,i)=>i+1),s=[...a].sort(()=>Math.random()-.5).slice(0,10);return a.map(num=>({num,taken:false,shield:s.includes(num),assignedTo:null}))}
function game(label){return {label,players:players(),pot:null,week:1,round:1,armoury:armoury(),log:[],notes:[],wildHistory:[],currentVotes:{},share:{headline:'THE GAME BEGINS',sub:'Trust no one.'}}}
try{C.state=JSON.parse(localStorage.getItem(LK))}catch{} if(!C.state)C.state={current:'A',tab:'Dashboard',games:{A:game('Game A'),B:game('Game B')}};
C.g=()=>C.state.games[C.state.current];C.shape=()=>{let g=C.g();g.notes??=[];g.log??=[];g.currentVotes??={};g.wildHistory??=[]};
const sess=()=>{try{return JSON.parse(localStorage.getItem(SK)||'null')}catch{return null}},store=x=>x?localStorage.setItem(SK,JSON.stringify(x)):localStorage.removeItem(SK);
async function req(path,opt={}){let s=sess(),h={apikey:KEY,'Content-Type':'application/json',...(opt.headers||{})};if(s?.access_token)h.Authorization='Bearer '+s.access_token;let r=await fetch(URL+path,{...opt,headers:h}),t=await r.text(),b=null;try{b=t?JSON.parse(t):null}catch{b=t}if(!r.ok)throw Error(b?.msg||b?.message||b?.error_description||b?.error||`HTTP ${r.status}`);return b}
C.auth={session:sess,async login(email,password){let b=await req('/auth/v1/token?grant_type=password',{method:'POST',body:JSON.stringify({email,password}),headers:{Authorization:''}});store(b);return b},logout(){store(null)}};
C.remote=false;C.setSync=(t,k='')=>{let e=document.getElementById('syncPill');if(e){e.textContent=t;e.className='syncpill'+(k?' '+k:'')}};
C.save=()=>{localStorage.setItem(LK,JSON.stringify(C.state));if(C.remote){clearTimeout(C.timer);C.setSync('Saving…');C.timer=setTimeout(C.saveRemote,300)}};
C.saveRemote=async()=>{try{await req('/rest/v1/cms_traitors_state',{method:'POST',body:JSON.stringify({id:'main',state:C.state,updated_at:new Date().toISOString()}),headers:{Prefer:'resolution=merge-duplicates,return=minimal'}});C.setSync('Synced','ok')}catch(e){console.error(e);C.setSync('Sync failed','bad')}};
C.loadRemote=async()=>{C.setSync('Loading…');let b=await req('/rest/v1/cms_traitors_state?id=eq.main&select=state');if(Array.isArray(b)&&b[0]?.state)C.state=b[0].state;else await C.saveRemote();C.remote=true;localStorage.setItem(LK,JSON.stringify(C.state));C.setSync('Synced','ok')};
C.log=text=>{C.shape();C.g().log.unshift({id:uuid(),ts:new Date().toISOString(),text});C.save()};
C.latestNote=id=>C.g().notes.filter(n=>n.playerId===id).sort((a,b)=>(b.date||'').localeCompare(a.date||'')||(b.ts||'').localeCompare(a.ts||''))[0];
C.story=(type,p)=>{let n=C.latestNote(p.id),lead=n?.text?`${n.text.trim()} `:'';if(type==='banish')return `${lead}The group ultimately turned on ${p.name} and banished ${p.name}. ${p.name} was revealed as a ${p.role}. ${p.role==='Traitor'?'Well done, Faithfuls!':'The Traitors will be delighted with that result.'}`;if(type==='murder')return `${lead}Before the next gathering, the Traitors struck. ${p.name} was murdered and removed from the game.`;return ''};
C.modal=(title,body,yes='Confirm')=>new Promise(ok=>{modalRoot.innerHTML=`<div class="modalback"><div class="modal"><h2>${C.esc(title)}</h2><div>${body}</div><div class="row"><button class="btn" id="mNo">Cancel</button><button class="btn primary" id="mYes">${C.esc(yes)}</button></div></div></div>`;mNo.onclick=()=>{modalRoot.innerHTML='';ok(false)};mYes.onclick=()=>{modalRoot.innerHTML='';ok(true)}});
})();</script>
<script>(()=>{const C=CMS,E=C.esc;
C.dashboard=()=>{let g=C.g(),m=g.players.filter(p=>p.status==='Murdered').length,b=g.players.filter(p=>p.status==='Banished').length;return `<div class="toolbar"><div class="field"><label>Current week</label><input id="weekInput" class="input" type="number" min="1" value="${g.week}"></div><div class="field"><label>Prize pot (€)</label><input id="potInput" class="input" value="${g.pot??''}" placeholder="Not decided"></div><button class="btn primary" id="saveGame">Save</button></div><div class="stats" style="grid-template-columns:repeat(4,minmax(0,1fr))"><div class="stat"><span>Murdered</span><strong>${m}</strong></div><div class="stat"><span>Banished</span><strong>${b}</strong></div><div class="stat"><span>Armoury left</span><strong>${g.armoury.filter(x=>!x.taken).length}</strong></div><div class="stat"><span>Wildcards used</span><strong>${g.wildHistory.length}</strong></div></div>`};
C.playersView=()=>`<div class="toolbar"><button class="btn" id="addPlayer">+ Add player</button><button class="btn" id="removeDummies">Remove unused dummy players</button></div><div class="player-grid">${C.g().players.map((p,i)=>`<article class="player ${p.status!=='Alive'?'dead':''}"><h3>${E(p.name)}</h3><div class="meta">${p.status}${p.shield?' • 🛡️ Shield':''}</div><div class="secret">Host: ${p.role}${p.notes?' • '+E(p.notes):''}</div><div class="actions"><button class="btn" data-a="edit" data-i="${i}">Edit</button><button class="btn green" data-a="shield" data-i="${i}" ${p.status!=='Alive'?'disabled':''}>${p.shield?'Transfer Shield':'Give Shield'}</button><button class="btn danger" data-a="murder" data-i="${i}" ${p.status!=='Alive'?'disabled':''}>Murder</button><button class="btn danger" data-a="banish" data-i="${i}" ${p.status!=='Alive'?'disabled':''}>Banish</button><button class="btn" data-a="role" data-i="${i}" ${p.status!=='Alive'?'disabled':''}>${p.role==='Traitor'?'Make Faithful':'Recruit'}</button><button class="btn" data-a="restore" data-i="${i}" ${p.status==='Alive'?'disabled':''}>Restore</button></div></article>`).join('')}</div>`;

C.importView=()=>`<div class="notice">Upload a one-column CSV with <b>Name</b> as the header. Preview it first, then either replace the current roster or add new names to it.</div><div class="field" style="margin-top:12px"><label>Roster CSV</label><input id="csvFile" class="input" type="file" accept=".csv,text/csv"></div><div class="toolbar"><button id="previewCsv" class="btn">Preview CSV</button><button id="importCsv" class="btn primary" disabled>Replace roster with CSV</button><button id="appendCsv" class="btn green" disabled>Add names to roster</button></div><div id="csvStatus" class="notice">No file selected.</div><div id="csvPreview" class="player-grid" style="margin-top:12px"></div>`;

C.storyStudioView=()=>{C.shape();let g=C.g();return `<div class="notice">AI Story Studio reads your Host Notes plus the public game timeline and produces a fresh, spoiler-safe recap. It should create tension without inventing events or revealing secret roles, Shield owners or future actions.</div><div class="toolbar" style="margin-top:12px"><div class="field"><label>Recap style</label><select id="storyMode" class="select"><option value="public_recap">Spoiler-free public recap</option><option value="host_story">Host-only dramatic storyline</option></select></div><div class="field"><label>Length</label><select id="storyLength" class="select"><option value="short">Short</option><option value="medium" selected>Medium</option><option value="long">Long</option></select></div><button id="generateStory" class="btn primary">Generate AI Story</button></div><div class="field"><label>Optional direction</label><textarea id="storyDirection" class="input textarea" placeholder="Example: build tension around John and Sarah's disagreement, but don't imply either is definitely a Traitor."></textarea></div><div id="storyStatus" class="notice">Uses all notes from the current game plus the existing game log.</div><div id="storyOutput" class="note-item" style="margin-top:12px;white-space:pre-wrap">No AI recap generated yet.</div><div class="toolbar"><button id="addStoryToLog" class="btn" disabled>Add to game log</button></div>`};

C.roundView=()=>{let a=C.g().players.filter(p=>p.status==='Alive');return `<div class="toolbar"><div class="field"><label>Round</label><input id="roundNo" class="input" type="number" min="1" value="${C.g().round}"></div><button id="clearVotes" class="btn">Clear current votes</button></div>${a.map(p=>`<div class="vote-row"><span>${E(p.name)}</span><select class="select target" data-v="${p.id}"><option value="">Vote for…</option>${a.filter(x=>x.id!==p.id).map(x=>`<option value="${x.id}">${E(x.name)}</option>`).join('')}</select><button class="btn" data-vote="${p.id}">Record</button></div>`).join('')}<div class="vote-tally" id="tally"></div>`};
C.armouryView=()=>`<div class="notice">60 envelopes • 10 Shields. Shield locations are visible only to you.</div><div class="armoury" style="margin-top:12px">${C.g().armoury.map(x=>`<button class="env ${x.shield?'shield':''} ${x.taken?'taken':''}" data-env="${x.num}" ${x.taken?'disabled':''}>${String(x.num).padStart(2,'0')}</button>`).join('')}</div>`;
C.wildView=()=>`<div class="wildcards">${C.WILDS.map(([n,d])=>`<div class="wild"><h3>${E(n)}</h3><p>${E(d)}</p><button class="btn" data-wild="${E(n)}">Activate</button></div>`).join('')}</div>`;
C.notesView=()=>{C.shape();let g=C.g();return `<div class="toolbar"><div class="field"><label>Date *</label><input id="noteDate" class="input" type="date" value="${C.today()}"></div><div class="field"><label>Player (optional)</label><select id="notePlayer" class="select"><option value="">General game note</option>${g.players.map(p=>`<option value="${p.id}">${E(p.name)}</option>`).join('')}</select></div></div><div class="field"><label>Host note *</label><textarea id="noteText" class="input textarea" placeholder="John was very vocal at the Round Table…"></textarea></div><div class="toolbar" style="margin-top:10px"><button id="addNote" class="btn primary">Save note</button></div><div class="notice">Player-linked notes automatically enrich later murder/banishment log entries.</div><div class="notes-list" style="margin-top:12px">${g.notes.length?g.notes.map((n,i)=>{let p=g.players.find(x=>x.id===n.playerId);return `<div class="note-item"><div class="note-head"><span class="note-date">${E(n.date)}</span><span class="note-player">${p?E(p.name):'General'}</span></div><div>${E(n.text)}</div><div class="toolbar" style="margin:8px 0 0"><button class="btn" data-note-story="${i}">Add as storyline log</button><button class="btn danger" data-note-delete="${i}">Delete note</button></div></div>`}).join(''):'<div class="notice">No host notes yet.</div>'}</div>`};
C.logView=()=>{C.shape();return `<div class="toolbar"><button id="clearLog" class="btn danger">Clear log</button></div><div class="log">${C.g().log.length?C.g().log.map((x,i)=>`<div class="log-item"><div class="log-copy"><time>${new Date(x.ts).toLocaleString()}</time><div>${E(x.text)}</div></div><button class="btn danger log-delete" data-log-delete="${i}">Delete</button></div>`).join(''):'<div class="notice">No events yet.</div>'}</div>`};
C.shareView=()=>{let g=C.g(),s=g.share||{},alive=g.players.filter(p=>p.status==='Alive').length;return `<div class="share-banner"><div class="big">${E(s.headline||'CMS TRAITORS')}</div><div class="sub">${E(s.sub||'')}</div></div><div class="share-header"><h2>CMS TRAITORS</h2><div class="meta">${E(g.label)} • ${alive} players remain${g.pot!=null?' • Pot €'+g.pot:''}</div></div><div class="share-wall">${g.players.map(p=>`<div class="share-card ${p.status!=='Alive'?'out':''} ${p.status==='Murdered'?'murdered':''}"><strong>${E(p.name)}</strong><span>${p.status==='Alive'?'Alive':p.status==='Murdered'?'☠️ Murdered':'🔥 Banished'+(p.revealedRole?' • '+p.revealedRole:'')}</span></div>`).join('')}</div><div class="toolbar" style="margin-top:14px"><button class="btn" id="shareWall">Player Wall</button><button class="btn" id="shareMurder">Murder Reveal</button><button class="btn" id="shareBanish">Banishment Reveal</button><button class="btn" id="sharePot">Prize Pot</button><button class="btn primary" onclick="window.print()">Print / Save</button></div>`};
})();</script>
<script>(()=>{const C=CMS,E=C.esc;let panel=document.getElementById('panel'),nav=document.getElementById('nav'),gameSelect=document.getElementById('gameSelect');
function stats(){let a=C.g().players.filter(p=>p.status==='Alive');aliveStat.textContent=a.length;faithfulStat.textContent=a.filter(p=>p.role==='Faithful').length;traitorStat.textContent=a.filter(p=>p.role==='Traitor').length;shieldStat.textContent=a.filter(p=>p.shield).length;potStat.textContent=C.g().pot==null?'TBD':'€'+C.g().pot;weekStat.textContent=C.g().week}
function navs(){nav.innerHTML=C.TABS.map(t=>`<button class="btn ${C.state.tab===t?'active':''}" data-tab="${t}">${t}</button>`).join('');nav.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{C.state.tab=b.dataset.tab;C.save();render()})}
function render(){C.shape();stats();navs();gameSelect.value=C.state.current;let t=C.state.tab||'Dashboard';panel.innerHTML=t==='Dashboard'?C.dashboard():t==='Players'?C.playersView():t==='Player Import'?C.importView():t==='Round Table'?C.roundView():t==='Armoury'?C.armouryView():t==='Wildcards'?C.wildView():t==='Host Notes'?C.notesView():t==='Story Studio'?C.storyStudioView():t==='Game Log'?C.logView():C.shareView();bind()}
function editPlayer(p){modalRoot.innerHTML=`<div class="modalback"><div class="modal"><h2>Edit player</h2><div class="field"><label>Full name</label><input id="pn" class="input" value="${E(p.name)}"></div><div class="field"><label>Private host note</label><input id="ph" class="input" value="${E(p.notes||'')}"></div><div class="row"><button class="btn" id="mNo">Cancel</button><button class="btn primary" id="mYes">Save</button></div></div></div>`;mNo.onclick=()=>modalRoot.innerHTML='';mYes.onclick=()=>{p.name=pn.value.trim()||p.name;p.notes=ph.value.trim();C.log(`Player details updated: ${p.name}.`);modalRoot.innerHTML='';render()}}
function transfer(p){let a=C.g().players.filter(x=>x.status==='Alive'&&x.id!==p.id);modalRoot.innerHTML=`<div class="modalback"><div class="modal"><h2>Transfer ${E(p.name)}'s Shield</h2><select id="sr" class="select" style="width:100%"><option value="">Choose player…</option>${a.map(x=>`<option value="${x.id}">${E(x.name)}</option>`).join('')}</select><div class="row"><button class="btn danger" id="rm">Remove Shield</button><button class="btn" id="mNo">Cancel</button><button class="btn primary" id="mYes">Transfer</button></div></div></div>`;mNo.onclick=()=>modalRoot.innerHTML='';rm.onclick=()=>{p.shield=false;C.log(`${p.name}'s Shield was removed.`);modalRoot.innerHTML='';render()};mYes.onclick=()=>{let r=C.g().players.find(x=>x.id===sr.value);if(!r)return alert('Choose a player.');p.shield=false;r.shield=true;C.log(`${p.name} transferred their Shield to ${r.name}.`);modalRoot.innerHTML='';render()}}
function tally(){let b=document.getElementById('tally'),c={};if(!b)return;Object.values(C.g().currentVotes).forEach(id=>c[id]=(c[id]||0)+1);b.innerHTML=Object.entries(c).sort((a,b)=>b[1]-a[1]).map(([id,n])=>`<div class="tally"><span>${E(C.g().players.find(p=>p.id===id)?.name||'Unknown')}</span><strong>${n}</strong></div>`).join('')||'<div class="notice">No votes recorded yet.</div>'}
function bind(){let g=C.g();if(window.saveGame)saveGame.onclick=()=>{g.week=Math.max(1,+weekInput.value||1);g.pot=potInput.value.trim()===''?null:Math.max(0,+potInput.value||0);C.log(`Week set to ${g.week}${g.pot!=null?`; pot €${g.pot}`:''}.`);render()};
const addPlayerEl=document.getElementById('addPlayer');if(addPlayerEl)addPlayerEl.onclick=()=>{if(g.players.length>=40)return alert('Maximum 40 players.');modalRoot.innerHTML=`<div class="modalback"><div class="modal"><h2>Add player</h2><div class="field"><label>Full name</label><input id="newPlayerName" class="input" placeholder="Enter player name"></div><div class="row"><button class="btn" id="mNo">Cancel</button><button class="btn primary" id="mYes">Add player</button></div></div></div>`;document.getElementById('mNo').onclick=()=>modalRoot.innerHTML='';document.getElementById('mYes').onclick=()=>{const n=document.getElementById('newPlayerName').value.trim();if(!n)return alert('Enter a player name.');g.players.push({id:crypto.randomUUID(),name:n,role:'Faithful',status:'Alive',shield:false,revealedRole:null,notes:''});C.log(`${n} added to the game.`);modalRoot.innerHTML='';C.save();render()}};
if(window.removeDummies)removeDummies.onclick=async()=>{if(await C.modal('Remove unused dummy players?','Only untouched Player XX entries are removed.','Remove')){g.players=g.players.filter(p=>!/^Player \d+$/.test(p.name)||p.status!=='Alive'||p.shield||p.notes);C.log('Unused dummy players removed.');render()}};
panel.querySelectorAll('[data-a]').forEach(b=>b.onclick=async()=>{
  let p=g.players[+b.dataset.i],a=b.dataset.a;
  if(a==='edit')return editPlayer(p);
  if(a==='shield'){
    if(p.shield)return transfer(p);
    p.shield=true;C.log(`${p.name} received a Shield.`);
  }
  if(a==='role'){p.role=p.role==='Traitor'?'Faithful':'Traitor';C.log(`${p.name} is now a ${p.role}.`)}
  if(a==='restore'){p.status='Alive';p.revealedRole=null;C.log(`${p.name} restored to active play.`)}
  if(a==='murder'){
    if(p.shield){
      p.shield=false;C.log(`${p.name} was targeted for murder but survived due to a Shield.`);
      g.share={headline:'A MURDER WAS ATTEMPTED',sub:'The intended victim was protected by a Shield.'};
    }else if(await C.modal('Confirm murder?',`Mark <b>${E(p.name)}</b> as murdered?`,'Murder')){
      p.status='Murdered';C.log(C.story('murder',p)||`${p.name} was murdered.`);
      g.share={headline:'THE TRAITORS HAVE STRUCK',sub:`${p.name} has been murdered.`};
    }
  }
  if(a==='banish'&&await C.modal('Confirm banishment?',`Mark <b>${E(p.name)}</b> as banished and reveal ${p.role}?`,'Banish')){
    p.status='Banished';p.revealedRole=p.role;C.log(C.story('banish',p));
    g.share={headline:'BANISHED',sub:`${p.name} was a ${p.role}.`};
  }
  C.save();render();
});
panel.querySelectorAll('[data-env]').forEach(b=>b.onclick=()=>{let x=g.armoury.find(e=>e.num===+b.dataset.env),a=g.players.filter(p=>p.status==='Alive');modalRoot.innerHTML=`<div class="modalback"><div class="modal"><h2>Envelope #${x.num}</h2><p>${x.shield?'🛡️ This contains a Shield.':'This contains nothing.'}</p><select id="as" class="select" style="width:100%"><option value="">No assignment</option>${a.map(p=>`<option value="${p.id}">${E(p.name)}</option>`).join('')}</select><div class="row"><button class="btn" id="mNo">Cancel</button><button class="btn primary" id="mYes">Mark taken</button></div></div></div>`;mNo.onclick=()=>modalRoot.innerHTML='';mYes.onclick=()=>{x.taken=true;x.assignedTo=as.value||null;if(x.shield&&x.assignedTo){let p=g.players.find(q=>q.id===x.assignedTo);p.shield=true;C.log(`Envelope #${x.num} was taken and its Shield assigned to ${p.name}.`)}else C.log(`Envelope #${x.num} was taken${x.shield?' and contained a Shield':''}.`);modalRoot.innerHTML='';render()}});
panel.querySelectorAll('[data-wild]').forEach(b=>b.onclick=()=>{g.wildHistory.push({week:g.week,name:b.dataset.wild});C.log(`Wildcard activated: ${b.dataset.wild}.`);render()});
if(window.addNote)addNote.onclick=()=>{let d=noteDate.value,t=noteText.value.trim();if(!d||!t)return alert('Date and note are required.');g.notes.unshift({id:crypto.randomUUID(),date:d,playerId:notePlayer.value||null,text:t,ts:new Date().toISOString()});C.save();render()};

if(window.previewCsv){
  let parsedNames=[];
  const parseCsv=async()=>{
    const f=csvFile.files?.[0]; if(!f) throw Error('Choose a CSV file first.');
    const text=await f.text();
    const lines=text.replace(/\r/g,'').split('\n').filter(x=>x.trim()!=='');
    if(!lines.length) throw Error('The CSV is empty.');
    const header=lines[0].replace(/^\uFEFF/,'').trim().replace(/^"|"$/g,'');
    if(header.toLowerCase()!=='name') throw Error('The first column header must be Name.');
    parsedNames=lines.slice(1).map(line=>{let v=line.trim();if(v.startsWith('"')&&v.endsWith('"'))v=v.slice(1,-1).replace(/""/g,'"');return v.trim()}).filter(Boolean);
    parsedNames=[...new Set(parsedNames)];
    if(!parsedNames.length) throw Error('No player names were found.');
    if(parsedNames.length>40) throw Error('Maximum 40 players per game.');
    csvStatus.textContent=`${parsedNames.length} names ready to import.`;
    csvPreview.innerHTML=parsedNames.map(n=>`<article class="player"><h3>${E(n)}</h3><div class="meta">Will be added as Faithful</div></article>`).join('');
    importCsv.disabled=false; appendCsv.disabled=false;
  };
  previewCsv.onclick=async()=>{try{await parseCsv()}catch(e){csvStatus.textContent=e.message;importCsv.disabled=true;appendCsv.disabled=true;csvPreview.innerHTML=''}};
  csvFile.onchange=()=>{importCsv.disabled=true;appendCsv.disabled=true;csvStatus.textContent='File selected. Tap Preview CSV.';csvPreview.innerHTML=''};
  importCsv.onclick=async()=>{
    try{if(!parsedNames.length)await parseCsv(); if(!await C.modal('Replace current roster?',`This will replace all players in ${E(g.label)} with ${parsedNames.length} names from the CSV.`,`Replace roster`))return;
      g.players=parsedNames.map(n=>({id:crypto.randomUUID(),name:n,role:'Faithful',status:'Alive',shield:false,revealedRole:null,notes:''}));
      g.currentVotes={}; g.notes=[]; g.share={headline:'THE GAME BEGINS',sub:'Trust no one.'};
      C.log(`Roster imported from CSV: ${parsedNames.length} players.`); render();
    }catch(e){csvStatus.textContent=e.message}
  };
  appendCsv.onclick=async()=>{
    try{
      if(!parsedNames.length)await parseCsv();
      const existing=new Set(g.players.map(p=>p.name.trim().toLowerCase()));
      const add=parsedNames.filter(n=>!existing.has(n.toLowerCase()));
      if(g.players.length+add.length>40) throw Error(`Adding these names would exceed the 40-player maximum. Current roster: ${g.players.length}; new unique names: ${add.length}.`);
      if(!add.length){csvStatus.textContent='All names in this CSV are already on the roster.';return;}
      if(!await C.modal('Add names to current roster?',`Add ${add.length} new player${add.length===1?'':'s'} to ${E(g.label)}? Existing players and game history will be kept.`,`Add players`))return;
      add.forEach(n=>g.players.push({id:crypto.randomUUID(),name:n,role:'Faithful',status:'Alive',shield:false,revealedRole:null,notes:''}));
      C.log(`Roster updated from CSV: ${add.length} new player${add.length===1?'':'s'} added.`);
      csvStatus.textContent=`${add.length} new player${add.length===1?'':'s'} added.`; render();
    }catch(e){csvStatus.textContent=e.message}
  };
}
if(window.generateStory){
  generateStory.onclick=async()=>{
    storyStatus.textContent='Generating…'; generateStory.disabled=true; addStoryToLog.disabled=true;
    try{
      const session=C.auth.session(); if(!session?.access_token) throw Error('Your Host session has expired. Sign in again.');
      const publicLog=g.log.filter(x=>!/(received a Shield|transferred their Shield|Shield was removed|is now a Traitor|is now a Faithful|Envelope #|Wildcard activated|Player details updated|restored to active play)/i.test(x.text||''));
      const isPublic=storyMode.value==='public_recap';
      const payload={
        mode:isPublic?'public':'host',
        gameName:g.label,
        direction:storyDirection.value.trim(),
        notes:g.notes.slice().sort((a,b)=>(a.date||'').localeCompare(b.date||'')),
        events:(isPublic?publicLog:g.log).slice().reverse(),
        publicPlayerState:g.players.map(p=>({name:p.name,status:p.status,revealedRole:p.status==='Banished'?p.revealedRole:null})),
        length:storyLength.value,
        week:g.week,
        pot:g.pot
      };
      const r=await fetch('https://icmswuaidofxxdqiovsj.supabase.co/functions/v1/cms-storyline',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+session.access_token,'apikey':'sb_publishable_vk6oqfLo2cClWhbHReLKJQ_oaLamxF8'},body:JSON.stringify(payload)});
      const data=await r.json().catch(()=>({})); if(!r.ok) throw Error(data.error||data.message||`HTTP ${r.status}`);
      const story=data.story||data.text||'';
      storyOutput.textContent=story||'No story returned.'; storyStatus.textContent='Generated from all current Host Notes and the game timeline.'; addStoryToLog.disabled=!story;
      addStoryToLog.onclick=()=>{if(story){C.log(story);render()}};
    }catch(e){storyStatus.textContent='AI generation unavailable: '+e.message;} finally{generateStory.disabled=false}
  };
}

panel.querySelectorAll('[data-note-delete]').forEach(b=>b.onclick=async()=>{if(await C.modal('Delete note?','Remove this Host Note?','Delete')){g.notes.splice(+b.dataset.noteDelete,1);C.save();render()}});panel.querySelectorAll('[data-note-story]').forEach(b=>b.onclick=()=>{let n=g.notes[+b.dataset.noteStory];if(n){C.log(n.text);render()}});
panel.querySelectorAll('[data-log-delete]').forEach(b=>b.onclick=async()=>{if(await C.modal('Delete log entry?','This removes the line only. It does not reverse the game action.','Delete')){g.log.splice(+b.dataset.logDelete,1);C.save();render()}});if(window.clearLog)clearLog.onclick=async()=>{if(await C.modal('Clear game log?','Delete all log lines?','Clear')){g.log=[];C.save();render()}};
if(window.clearVotes)clearVotes.onclick=()=>{g.currentVotes={};C.save();render()};panel.querySelectorAll('[data-vote]').forEach(b=>b.onclick=()=>{let s=panel.querySelector(`.target[data-v="${b.dataset.vote}"]`);if(s.value){g.currentVotes[b.dataset.vote]=s.value;C.save();tally()}});tally();
if(window.shareWall)shareWall.onclick=()=>{g.share={headline:'THE PLAYERS REMAIN',sub:'Who do you trust?'};C.save();render()};if(window.shareMurder)shareMurder.onclick=()=>{let n=prompt('Name for murder reveal:');if(n){g.share={headline:'THE TRAITORS HAVE STRUCK',sub:`${n} has been murdered.`};C.save();render()}};if(window.shareBanish)shareBanish.onclick=()=>{let n=prompt('Banished player name:'),r=n&&prompt('Faithful or Traitor?');if(n){g.share={headline:'BANISHED',sub:`${n} was a ${r||''}.`};C.save();render()}};if(window.sharePot)sharePot.onclick=()=>{g.share={headline:'THE PRIZE POT',sub:g.pot==null?'The pot is yet to be decided.':`€${g.pot}`};C.save();render()}}
gameSelect.onchange=()=>{C.state.current=gameSelect.value;C.save();render()};publicMode.onclick=()=>{C.state.tab='Share View';C.save();render()};signOutBtn.onclick=()=>{C.remote=false;C.auth.logout();app.classList.add('hidden');authGate.classList.remove('hidden');loginPassword.value=''};
loginForm.onsubmit=async e=>{e.preventDefault();authError.textContent='Contacting Supabase…';loginBtn.disabled=true;try{await C.auth.login(loginEmail.value.trim(),loginPassword.value);authError.textContent='Login accepted. Loading game…';await C.loadRemote();authGate.classList.add('hidden');app.classList.remove('hidden');render()}catch(x){authError.textContent='Login failed: '+x.message}finally{loginBtn.disabled=false}};
(async()=>{if(!C.auth.session())return;try{await C.loadRemote();authGate.classList.add('hidden');app.classList.remove('hidden');render()}catch(e){authError.textContent='Signed in, but game data failed to load: '+e.message}})();
})();</script>

</body></html>
