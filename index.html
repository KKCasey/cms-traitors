function players(n=30){return Array.from({length:n},(_,i)=>({id:uuid(),name:`Player ${String(i+1).padStart(2,'0')}`,role:i<2?'Traitor':'Faithful',status:'Alive',shield:false,shieldWeek:null,lastShieldWeek:null,dagger:false,revealedRole:null,notes:''}))}
function armoury(total=100,shieldCount=20,includeDagger=true){let nums=Array.from({length:total},(_,i)=>i+1),pool=[...nums].sort(()=>Math.random()-.5),shields=new Set(pool.slice(0,Math.min(shieldCount,total))),daggerNum=includeDagger?pool.find(n=>!shields.has(n)):null;return nums.map(num=>({num,taken:false,content:shields.has(num)?'Shield':num===daggerNum?'Dagger':'Blank',shield:shields.has(num),dagger:num===daggerNum,chosenBy:null,assignedTo:null,informed:false,openedWeek:null}))}
function game(label){return {label,players:players(),pot:null,week:1,round:1,startingTraitors:3,finaleMode:false,armouryConfig:{total:100,shields:20,dagger:true},armoury:armoury(100,20,true),missionTeams:[],missionSessions:[],missionScores:{},missionGoldApplied:{},paceExtras:{},secretFaithfulSelection:null,log:[],notes:[],wildHistory:[],currentVotes:{},share:{headline:'THE GAME BEGINS',sub:'Trust no one.'}}}
C.freshGame=(label)=>({label,players:[],pot:null,week:1,round:1,startingTraitors:3,finaleMode:false,armouryConfig:{total:100,shields:20,dagger:true},armoury:armoury(100,20,true),missionTeams:[],missionSessions:[],missionScores:{},missionGoldApplied:{},paceExtras:{},secretFaithfulSelection:null,log:[],notes:[],wildHistory:[],currentVotes:{},share:{headline:'THE GAME BEGINS',sub:'Trust no one.'}});
try{C.state=JSON.parse(localStorage.getItem(LK))}catch{} if(!C.state)C.state={current:'A',tab:'Dashboard',games:{A:game('Game A'),B:game('Game B')}};
C.g=()=>C.state.games[C.state.current];C.shape=()=>{let g=C.g();g.notes??=[];g.log??=[];g.currentVotes??={};g.wildHistory??=[];g.missionTeams??=[];g.missionSessions??=[];g.missionScores??={};g.missionGoldApplied??={};g.paceExtras??={};g.secretFaithfulSelection??=null;g.finaleMode??=false;g.startingTraitors??=(g.players?.length>25?3:2);g.armouryConfig??={total:g.armoury?.length||100,shields:(g.armoury||[]).filter(x=>x.shield||x.content==='Shield').length||20,dagger:(g.armoury||[]).some(x=>x.dagger||x.content==='Dagger')};if(g.armouryConfig.total===60&&g.armouryConfig.shields===10&&!(g.armoury||[]).some(x=>x.taken)){g.armouryConfig={total:100,shields:20,dagger:true};g.armoury=armoury(100,20,true)};(g.notes||[]).forEach(n=>{n.visibility??='secret'});(g.players||[]).forEach(p=>{p.shieldWeek??=p.shield?g.week:null;p.lastShieldWeek??=p.shield?p.shieldWeek:null;p.dagger??=false});(g.armoury||[]).forEach(x=>{x.content??=(x.shield?'Shield':x.dagger?'Dagger':'Blank');x.shield=x.content==='Shield';x.dagger=x.content==='Dagger';x.chosenBy??=x.assignedTo||null;x.informed??=false;x.openedWeek??=x.taken?g.week:null})};
const sess=()=>{try{return JSON.parse(localStorage.getItem(SK)||'null')}catch{return null}},store=x=>x?localStorage.setItem(SK,JSON.stringify(x)):localStorage.removeItem(SK);
async function req(path,opt={}){let s=sess(),h={apikey:KEY,'Content-Type':'application/json',...(opt.headers||{})};if(s?.access_token)h.Authorization='Bearer '+s.access_token;let r=await fetch(URL+path,{...opt,headers:h}),t=await r.text(),b=null;try{b=t?JSON.parse(t):null}catch{b=t}if(!r.ok)throw Error(b?.msg||b?.message||b?.error_description||b?.error||`HTTP ${r.status}`);return b}
C.auth={session:sess,async login(email,password){let b=await req('/auth/v1/token?grant_type=password',{method:'POST',body:JSON.stringify({email,password}),headers:{Authorization:''}});store(b);return b},logout(){store(null)}};
C.remote=false;C.setSync=(t,k='')=>{let e=document.getElementById('syncPill');if(e){e.textContent=t;e.className='syncpill'+(k?' '+k:'')}};
C.save=()=>{localStorage.setItem(LK,JSON.stringify(C.state));if(C.remote){clearTimeout(C.timer);C.setSync('Saving…');C.timer=setTimeout(C.saveRemote,300)}};
C.saveRemote=async()=>{try{await req('/rest/v1/cms_traitors_state',{method:'POST',body:JSON.stringify({id:'main',state:C.state,updated_at:new Date().toISOString()}),headers:{Prefer:'resolution=merge-duplicates,return=minimal'}});C.setSync('Synced','ok')}catch(e){console.error(e);C.setSync('Sync failed','bad')}};
C.loadRemote=async()=>{C.setSync('Loading…');let b=await req('/rest/v1/cms_traitors_state?id=eq.main&select=state');if(Array.isArray(b)&&b[0]?.state)C.state=b[0].state;else await C.saveRemote();C.remote=true;localStorage.setItem(LK,JSON.stringify(C.state));C.setSync('Synced','ok')};
C.log=text=>{C.shape();C.g().log.unshift({id:uuid(),ts:new Date().toISOString(),week:C.g().week,text});C.save()};
C.latestNote=id=>C.g().notes.filter(n=>n.playerId===id).sort((a,b)=>(b.date||'').localeCompare(a.date||'')||(b.ts||'').localeCompare(a.ts||''))[0];
C.story=(type,p)=>{let n=C.latestNote(p.id),lead=n?.text?`${n.text.trim()} `:'';if(type==='banish')return `${lead}The group ultimately turned on ${p.name} and banished ${p.name}. ${p.name} was revealed as a ${p.role}. ${p.role==='Traitor'?'Well done, Faithfuls!':'The Traitors will be delighted with that result.'}`;if(type==='murder')return `${lead}Before the next gathering, the Traitors struck. ${p.name} was murdered and removed from the game.`;return ''};
C.suggestedTraitors=()=>C.g().players.length<=25?2:3;
C.planForWeek=(w)=>C.ELIM_PLAN.find(x=>x.week===Number(w))||C.ELIM_PLAN[C.ELIM_PLAN.length-1];
C.extraForWeek=(w)=>{let g=C.g(),defaults={3:1,5:1,6:1};return Number(g.paceExtras?.[w]??defaults[w]??0)};C.cumulativePlannedElims=(w)=>C.ELIM_PLAN.filter(x=>x.week<=Number(w)).reduce((n,x)=>n+x.murders+x.banishments+C.extraForWeek(x.week),0);
C.expireShields=(beforeWeek=C.g().week)=>{let g=C.g(),expired=[];g.players.forEach(p=>{if(p.shield&&Number(p.shieldWeek||0)<beforeWeek){p.shield=false;expired.push(p.name)}});if(expired.length)C.log(`Expired Shield protection: ${expired.join(', ')}.`);return expired};
C.canReceiveShield=(p,week=C.g().week)=>p&&p.status==='Alive'&&!p.shield&&Number(p.lastShieldWeek||0)!==week-1;
C.giveShield=(p,week=C.g().week)=>{if(!C.canReceiveShield(p,week))return false;p.shield=true;p.shieldWeek=week;p.lastShieldWeek=week;return true};

C.modal=(title,body,yes='Confirm')=>new Promise(ok=>{modalRoot.innerHTML=`<div class="modalback"><div class="modal"><h2>${C.esc(title)}</h2><div>${body}</div><div class="row"><button class="btn" id="mNo">Cancel</button><button class="btn primary" id="mYes">${C.esc(yes)}</button></div></div></div>`;mNo.onclick=()=>{modalRoot.innerHTML='';ok(false)};mYes.onclick=()=>{modalRoot.innerHTML='';ok(true)}});
})();</script>
<script>(()=>{const C=CMS,E=C.esc;
C.dashboard=()=>{let g=C.g(),m=g.players.filter(p=>p.status==='Murdered').length,b=g.players.filter(p=>p.status==='Banished').length,aliveTraitors=g.players.filter(p=>p.status==='Alive'&&p.role==='Traitor').length,suggested=C.suggestedTraitors(),traitorGuide=suggested?`Your starting setup is <b>${g.startingTraitors||suggested} Traitors</b> (Host setting), with <b>${g.players.filter(p=>p.role==='Traitor').length}</b> currently assigned that role across the full roster.`:`For <b>${g.players.length} players</b>, you have not yet fixed the starting Traitor count. You confirmed 2 at 25 or fewer, and 3 if the roster stays at 29. Set the target manually.`,recruitMsg=aliveTraitors===1?(g.week<=3?'⚠️ One Traitor remains. Recruitment is mandatory under your rules for Weeks 1–3.':'ℹ️ One Traitor remains. From Week 4 onward, recruitment is optional.'):'';let total=g.players.length,alive=g.players.filter(p=>p.status==='Alive').length,targetElims=Math.min(C.cumulativePlannedElims(g.week),Math.max(0,total-6)),targetAlive=Math.max(6,total-targetElims),delta=alive-targetAlive,pace=delta===0?'On target':delta>0?`${delta} above target`:`${Math.abs(delta)} ahead of target`;return `<div class="toolbar"><div class="field"><label>Current week</label><input id="weekInput" class="input" type="number" min="1" max="7" value="${g.week}"></div><div class="field"><label>Prize pot / Gold</label><input id="potInput" class="input" value="${g.pot??''}" placeholder="Not decided"></div><div class="field"><label>Target starting Traitors</label><input id="startingTraitorsInput" class="input" type="number" min="1" max="6" value="${g.startingTraitors}"></div><div class="field"><label>Finale mode</label><select id="finaleModeInput" class="select"><option value="false" ${!g.finaleMode?'selected':''}>Off</option><option value="true" ${g.finaleMode?'selected':''}>On • hide banished roles</option></select></div><button class="btn primary" id="saveGame">Save</button><button class="btn danger" id="resetGame">Reset Game</button></div><div class="notice">Roster: <b>${g.players.length}</b> players. ${traitorGuide} The target above is a Host reminder only and will not change anyone's role automatically.</div>${recruitMsg?`<div class="notice" style="margin-top:10px">${recruitMsg}</div>`:''}<div class="notice" style="margin-top:10px"><b>7-week pace:</b> Week ${g.week} target is about <b>${targetAlive} alive</b>. You currently have <b>${alive}</b> alive, so you are <b>${pace}</b>. Recruitment or blocked murders can be recovered later using the planned catch-up twists in Game Plan.</div><div class="stats" style="grid-template-columns:repeat(4,minmax(0,1fr));margin-top:12px"><div class="stat"><span>Murdered</span><strong>${m}</strong></div><div class="stat"><span>Banished</span><strong>${b}</strong></div><div class="stat"><span>Armoury left</span><strong>${g.armoury.filter(x=>!x.taken).length}</strong></div><div class="stat"><span>Wildcards used</span><strong>${g.wildHistory.length}</strong></div></div>`};
C.gamePlanView=()=>{let g=C.g(),total=g.players.length||33,alive=g.players.filter(p=>p.status==='Alive').length;return `<div class="notice"><b>Host-only 7-week pace plan.</b> Uses your current roster and a goal of no more than 6 players entering End Game. Three additional elimination slots are planned for a 33-player start; change these if the pace shifts. Double rounds are announced to players when they come into effect. Nothing on this screen performs eliminations automatically.</div><div style="overflow-x:auto;margin-top:12px"><table style="width:100%;border-collapse:collapse;min-width:850px"><thead><tr><th style="text-align:left;padding:9px;border-bottom:1px solid var(--line)">Week</th><th style="text-align:left;padding:9px;border-bottom:1px solid var(--line)">Tuesday murder reveal</th><th style="text-align:left;padding:9px;border-bottom:1px solid var(--line)">Thursday banishment</th><th style="text-align:left;padding:9px;border-bottom:1px solid var(--line)">Twist / focus</th><th style="text-align:left;padding:9px;border-bottom:1px solid var(--line)">Target alive</th><th style="text-align:left;padding:9px;border-bottom:1px solid var(--line)">Host note</th></tr></thead><tbody>${C.ELIM_PLAN.map(x=>{let cum=C.cumulativePlannedElims(x.week),target=Math.max(6,total-cum),cur=x.week===g.week;return `<tr style="${cur?'background:rgba(208,167,83,.08)':''}"><td style="padding:9px;border-bottom:1px solid var(--line)"><b>${x.week}${cur?' • current':''}</b></td><td style="padding:9px;border-bottom:1px solid var(--line)">${x.murders===0?'None':x.murders===1?'1 murder':'2 murder slots'}</td><td style="padding:9px;border-bottom:1px solid var(--line)">${x.banishments===1?'1 banishment':'2 banishments'}</td><td style="padding:9px;border-bottom:1px solid var(--line)">${E(x.twist)}<div class="meta">Extra planned eliminations: ${C.extraForWeek(x.week)}</div></td><td style="padding:9px;border-bottom:1px solid var(--line)"><b>${target}</b></td><td style="padding:9px;border-bottom:1px solid var(--line)">${E(x.note)}</td></tr>`}).join('')}</tbody></table></div><div class="toolbar" style="margin-top:12px"><div class="field"><label>Adjust week</label><select id="paceWeek" class="select">${C.ELIM_PLAN.map(x=>`<option value="${x.week}" ${x.week===g.week?'selected':''}>Week ${x.week}</option>`).join('')}</select></div><div class="field"><label>Extra eliminations that week</label><input type="number" id="paceExtra" class="input" min="0" max="5" value="${C.extraForWeek(g.week)}"></div><button id="savePace" class="btn primary">Save pace</button></div><div class="notice" style="margin-top:12px"><b>Recruitment contingency:</b> recruitment uses one murder slot. On a two-murder week the other slot still goes ahead. If the game falls more than one player behind pace, use Death List or an extra murder/banishment in a later announced round. Current alive: <b>${alive}</b>.</div>`};
C.playersView=()=>`<div class="toolbar"><button class="btn" id="addPlayer">+ Add player</button><button class="btn" id="removeDummies">Remove unused dummy players</button></div><div class="player-grid">${C.g().players.map((p,i)=>`<article class="player ${p.status!=='Alive'?'dead':''}"><h3>${E(p.name)}</h3><div class="meta">${p.status}${p.shield?' • 🛡️ Shield (Week '+p.shieldWeek+')':''}${p.dagger?' • 🗡️ Dagger':''}</div><div class="secret">Host: ${p.role}${p.notes?' • '+E(p.notes):''}</div><div class="actions"><button class="btn" data-a="edit" data-i="${i}">Edit</button><button class="btn green" data-a="shield" data-i="${i}" ${p.status!=='Alive'?'disabled':''}>${p.shield?'Transfer Shield':'Give Shield'}</button><button class="btn danger" data-a="murder" data-i="${i}" ${p.status!=='Alive'?'disabled':''}>Murder</button><button class="btn danger" data-a="banish" data-i="${i}" ${p.status!=='Alive'?'disabled':''}>Banish</button><button class="btn" data-a="role" data-i="${i}" ${p.status!=='Alive'?'disabled':''}>${p.role==='Traitor'?'Make Faithful':'Recruit'}</button><button class="btn" data-a="restore" data-i="${i}" ${p.status==='Alive'?'disabled':''}>Restore</button></div></article>`).join('')}</div>`;

C.importView=()=>`<div class="notice">Upload a one-column CSV with <b>Name</b> as the header. Preview it first, then either replace the current roster or add new names to it.</div><div class="field" style="margin-top:12px"><label>Roster CSV</label><input id="csvFile" class="input" type="file" accept=".csv,text/csv"></div><div class="toolbar"><button id="previewCsv" class="btn">Preview CSV</button><button id="importCsv" class="btn primary" disabled>Replace roster with CSV</button><button id="appendCsv" class="btn green" disabled>Add names to roster</button></div><div id="csvStatus" class="notice">No file selected.</div><div id="csvPreview" class="player-grid" style="margin-top:12px"></div>`;

C.missionToolsView=()=>{let g=C.g(),alive=g.players.filter(p=>p.status==='Alive'),teams=g.missionTeams||[],sessions=g.missionSessions||[],selected=g.players.find(p=>p.id===g.secretFaithfulSelection);let sessionName=i=>i===0?'Session A':i===1?'Session B':'Overflow / alternate slot';return `<div class="tool-card"><h3>Tuesday Mission: two 15-minute slots</h3><p class="meta">Each slot is capped at 16. With ${alive.length} living players, ${Math.max(0,alive.length-32)} need an alternate arrangement; the app never silently excludes them. Arrange a short third slot or a separate equivalent challenge.</p><div class="toolbar"><div class="field"><label>Teams per full session</label><input id="teamCount" class="input" type="number" min="2" max="8" value="${g.teamsPerSession||4}"></div><button id="generateTeams" class="btn primary">Randomise sessions & teams</button><button id="clearTeams" class="btn">Clear mission setup</button></div><div class="notice">${alive.length} living players · ${sessions.length?sessions.map((x,i)=>sessionName(i)+': '+x.length).join(' · '):'No session allocation yet'}</div></div>${teams.length?`<div class="tool-card" style="margin-top:12px"><h3>Combined team leaderboard & Gold</h3><p class="meta">Enter each team’s challenge score and Gold earned. All teams add to the pot, but highest challenge scores across both sessions win Armoury access. Gold is applied only once per team; equal scores require your announced tie-breaker.</p><div class="team-grid">${teams.map((team,i)=>{let score=g.missionScores?.[i]||{},batch=i<(g.teamsPerSession||4)?'A':i<2*(g.teamsPerSession||4)?'B':'Overflow';return `<div class="team-card"><h4>Team ${i+1} · ${batch}</h4>${team.map(id=>`<div>${E(g.players.find(p=>p.id===id)?.name||'Unknown')}</div>`).join('')}<div class="field"><label>Score</label><input class="input" type="number" min="0" max="9999" data-score="${i}" value="${score.points??''}" placeholder="Points"></div><div class="field"><label>Gold earned</label><input class="input" type="number" min="0" max="100000" data-gold="${i}" value="${score.gold??''}" placeholder="Gold"></div><button class="btn" data-save-score="${i}">Save team result</button><button class="btn green" data-apply-gold="${i}" ${g.missionGoldApplied?.[i]?'disabled':''}>${g.missionGoldApplied?.[i]?'Gold added':'Add earned Gold to pot'}</button></div>`}).join('')}</div><div class="notice" style="margin-top:12px"><b>Overall leaderboard:</b><br>${teams.map((team,i)=>({i,score:g.missionScores?.[i]?.points})).filter(x=>Number.isFinite(x.score)).sort((a,b)=>b.score-a.score).map(x=>`Team ${x.i+1}: ${x.score} points`).join(' · ')||'Enter team scores to see ranking.'}</div></div>`:''}<div class="tool-card" style="margin-top:12px"><h3>Secret Faithful Mission Selector</h3><p class="meta">Randomly selects one living Faithful. Traitors and eliminated players are excluded.</p><div class="toolbar"><button id="pickSecretFaithful" class="btn primary">Pick random Faithful</button><button id="clearSecretFaithful" class="btn">Clear</button></div>${selected?`<div class="story-card"><span class="story-badge">Host only</span><h3>${E(selected.name)}</h3></div>`:'<div class="notice">No player selected.</div>'}</div><div class="tool-card" style="margin-top:12px"><h3>Weekly Shield Reset</h3><p class="meta">Shields expire before the next Tuesday Challenge. Advancing the week expires previous-week Shields.</p><button id="expireShieldsNow" class="btn danger">Expire current Shields</button></div>`};
C.roundView=()=>{let g=C.g(),a=g.players.filter(p=>p.status==='Alive'),daggerHolders=a.filter(p=>p.dagger);return `<div class="toolbar"><div class="field"><label>Round</label><input id="roundNo" class="input" type="number" min="1" value="${g.round}"></div><button id="saveRound" class="btn">Save round number</button><button id="clearVotes" class="btn">Clear current votes</button><button id="nextBanishment" class="btn">Start 2nd banishment</button>${daggerHolders.length?'<button id="consumeDagger" class="btn danger">Consume Dagger after vote</button>':''}</div><div class="round-layout"><div class="vote-list">${a.map(p=>`<div class="vote-row"><span>${E(p.name)}${p.dagger?' 🗡️':''}</span><select class="select target" data-v="${p.id}"><option value="">Vote for…</option>${a.filter(x=>x.id!==p.id).map(x=>`<option value="${x.id}" ${g.currentVotes[p.id]===x.id?'selected':''}>${E(x.name)}</option>`).join('')}</select><button class="btn" data-vote="${p.id}">${g.currentVotes[p.id]?'Update':'Record'}</button></div>`).join('')}</div><div><div class="notice"><b>Live vote tally</b><br>Highest total stays at the top. A player holding the Dagger has a double vote. Consume it manually once that double vote is finished.</div><div class="vote-tally" id="tally" style="margin-top:10px"></div></div></div>`};
C.armouryView=()=>{let g=C.g(),cfg=g.armouryConfig,taken=g.armoury.filter(x=>x.taken).sort((a,b)=>(b.openedWeek||0)-(a.openedWeek||0)||b.num-a.num);return `<div class="toolbar"><div class="field"><label>Total envelopes</label><input id="armTotal" class="input" type="number" min="20" max="150" value="${cfg.total}"></div><div class="field"><label>Shields hidden inside</label><input id="armShields" class="input" type="number" min="1" max="40" value="${cfg.shields}"></div><div class="field"><label>Dagger</label><select id="armDagger" class="select"><option value="true" ${cfg.dagger?'selected':''}>1 hidden Dagger</option><option value="false" ${!cfg.dagger?'selected':''}>No Dagger</option></select></div><button id="rebuildArmoury" class="btn danger">Rebuild Armoury</button></div><div class="notice">${cfg.total} envelopes • ${cfg.shields} Shields • ${cfg.dagger?'1 Dagger':'No Dagger'}. Locations are Host-only. Rebuilding re-randomises all contents.</div><div class="armoury" style="margin-top:12px">${g.armoury.map(x=>`<button class="env ${x.shield?'shield':''} ${x.dagger?'dagger':''} ${x.taken?'taken':''}" data-env="${x.num}">${String(x.num).padStart(2,'0')}${x.taken?`<span class="tiny">${x.informed?'informed':'not informed'}</span>`:''}</button>`).join('')}</div><h3 style="margin-top:18px;color:#dfc487">Envelope picks</h3><div class="pick-list">${taken.length?taken.map(x=>{let chooser=g.players.find(p=>p.id===x.chosenBy),recipient=g.players.find(p=>p.id===x.assignedTo);return `<div class="pick-row"><div><b>#${x.num}</b> • ${E(chooser?.name||'Unassigned')}<div class="meta">Host: ${E(x.content)}${recipient&&recipient.id!==chooser?.id?` → ${E(recipient.name)}`:''} • Week ${x.openedWeek||'?'}</div></div><button class="btn ${x.informed?'green':''}" data-informed="${x.num}">${x.informed?'✓ Informed':'Mark informed'}</button></div>`}).join(''):'<div class="notice">No envelopes taken yet.</div>'}</div>`};
C.envelopeBoardView=()=>{let g=C.g(),taken=g.armoury.filter(x=>x.taken).length,active=g.armoury.length-taken;return `<div class="envelope-share-wrap"><div class="envelope-share-head"><h2>CMS TRAITORS • ARMOURY</h2><div class="meta">${active} envelopes still active • ${taken} picked</div></div><div class="envelope-share-grid">${g.armoury.map(x=>`<div class="envelope-share-tile ${x.taken?'taken':''}">${String(x.num).padStart(3,'0')}</div>`).join('')}</div><div class="envelope-legend"><span><i class="legend-swatch"></i>Available</span><span><i class="legend-swatch taken"></i>Picked</span></div></div><div class="toolbar" style="margin-top:14px"><button class="btn primary" onclick="window.print()">Print / Save</button></div><div class="notice">Safe to screenshot. This board shows only whether an envelope has been picked. It never shows Shields, the Dagger, recipients or envelope contents.</div>`};

C.wildView=()=>`<div class="notice">These are the wildcard types you have actually chosen for this game. They are scheduled by the Host and announced only in the week they take effect.</div><div class="wildcards" style="margin-top:12px">${C.WILDS.map(([n,d])=>`<div class="wild"><h3>${E(n)}</h3><p>${E(d)}</p><button class="btn" data-wild="${E(n)}">Activate</button>${n==='Secret Faithful Mission'?'<button class="btn green" id="wildPickFaithful">Pick random Faithful</button>':''}</div>`).join('')}</div>`;
C.notesView=()=>{C.shape();let g=C.g();return `<div class="toolbar"><div class="field"><label>Date *</label><input id="noteDate" class="input" type="date" value="${C.today()}"></div><div class="field"><label>Player (optional)</label><select id="notePlayer" class="select"><option value="">General game note</option>${g.players.map(p=>`<option value="${p.id}">${E(p.name)}</option>`).join('')}</select></div><div class="field"><label>AI visibility</label><select id="noteVisibility" class="select"><option value="public">Public observation</option><option value="secret">Host secret</option></select></div></div><div class="field"><label>Host note *</label><textarea id="noteText" class="input textarea" placeholder="John was very vocal at the Round Table…"></textarea></div><div class="toolbar" style="margin-top:10px"><button id="addNote" class="btn primary">Save note</button></div><div class="notice">Notes are tagged to the current week. Public AI recaps only receive notes marked <b>Public observation</b>; Host-only storylines can use everything.</div><div class="notes-list" style="margin-top:12px">${g.notes.length?g.notes.map((n,i)=>{let p=g.players.find(x=>x.id===n.playerId);return `<div class="note-item"><div class="note-head"><span class="note-date">${E(n.date)} • Week ${n.week||'?'}</span><span class="note-player">${p?E(p.name):'General'} • ${n.visibility==='secret'?'🔒 Host secret':'Public observation'}</span></div><div>${E(n.text)}</div><div class="toolbar" style="margin:8px 0 0"><button class="btn" data-note-story="${i}">Add as storyline log</button><button class="btn danger" data-note-delete="${i}">Delete note</button></div></div>`}).join(''):'<div class="notice">No host notes yet.</div>'}</div>`};
C.storyStudioView=()=>{C.shape();let g=C.g();return `<div class="notice"><b>AI Story Studio</b> turns your Host Notes and public timeline into fresh, spoiler-safe posts for Teams. Use an end-of-week wrap-up on Thursday/Friday, then a new-week opener to remind everyone what happened and turn the pressure back up.</div><div class="toolbar" style="margin-top:12px"><div class="field"><label>Story type</label><select id="storyMode" class="select"><option value="public_recap">General public recap</option><option value="week_wrap">End-of-week wrap-up</option><option value="week_opener">Start-of-week recap & teaser</option><option value="host_story">Host-only season storyline</option></select></div><div class="field"><label>Use notes/events from</label><select id="storyScope" class="select"><option value="current">Current week (Week ${g.week})</option><option value="previous">Previous week (Week ${Math.max(1,g.week-1)})</option><option value="all">Entire game</option></select></div><div class="field"><label>Tone</label><select id="storyTone" class="select"><option value="balanced">Balanced</option><option value="tense" selected>Tense</option><option value="playful">Playful</option></select></div><div class="field"><label>Length</label><select id="storyLength" class="select"><option value="short">Short</option><option value="medium" selected>Standard</option><option value="long">Dramatic</option></select></div><button id="generateStory" class="btn primary">Generate</button></div><div class="field"><label>Optional director note</label><textarea id="storyDirection" class="input textarea" placeholder="Example: focus on John and Sarah's disagreement, mention Michael being unusually quiet, and end by asking whether everyone is looking in the wrong direction."></textarea></div><div id="storyStatus" class="notice">Nothing generated yet.</div><div class="story-card"><span id="storyBadge" class="story-badge">Public-safe recap</span><h3 id="storyTitle">CMS Traitors Story</h3><div id="storyOutput" class="story-output">No AI story generated yet.</div></div><div class="toolbar"><button id="copyStory" class="btn green" disabled>Copy for Teams</button><button id="addStoryToLog" class="btn" disabled>Save to Storyline Log</button><button id="generateAgain" class="btn" disabled>Generate Again</button></div>`};
C.logView=()=>{C.shape();return `<div class="toolbar"><button id="clearLog" class="btn danger">Clear log</button></div><div class="log">${C.g().log.length?C.g().log.map((x,i)=>`<div class="log-item"><div class="log-copy"><time>${new Date(x.ts).toLocaleString()} • Week ${x.week||'?'}</time><div>${E(x.text)}</div></div><button class="btn danger log-delete" data-log-delete="${i}">Delete</button></div>`).join(''):'<div class="notice">No events yet.</div>'}</div>`};
C.shareView=()=>{let g=C.g(),s=g.share||{},alive=g.players.filter(p=>p.status==='Alive').length;return `<div class="share-banner"><div class="big">${E(s.headline||'CMS TRAITORS')}</div><div class="sub">${E(s.sub||'')}</div></div><div class="share-header"><h2>CMS TRAITORS</h2><div class="meta">${E(g.label)} • ${alive} players remain${g.pot!=null?' • Pot €'+g.pot:''}</div></div><div class="share-wall ${g.players.length===33?'thirty-three':''}">${g.players.map(p=>`<div class="share-card ${p.status!=='Alive'?'out':''} ${p.status==='Murdered'?'murdered':''}"><strong>${E(p.name)}</strong><span>${p.status==='Alive'?'Alive':p.status==='Murdered'?'☠️ Murdered':'🔥 Banished'+(p.revealedRole?' • '+p.revealedRole:'')}</span></div>`).join('')}</div><div class="toolbar" style="margin-top:14px"><button class="btn" id="shareWall">Player Wall</button><button class="btn" id="shareMurder">Murder Reveal</button><button class="btn" id="shareBanish">Banishment Reveal</button><button class="btn" id="sharePot">Prize Pot</button><button class="btn primary" onclick="window.print()">Print / Save</button></div>`};
})();</script>
<script>(()=>{const C=CMS,E=C.esc;let panel=document.getElementById('panel'),nav=document.getElementById('nav'),gameSelect=document.getElementById('gameSelect');
function stats(){let a=C.g().players.filter(p=>p.status==='Alive');aliveStat.textContent=a.length;faithfulStat.textContent=a.filter(p=>p.role==='Faithful').length;traitorStat.textContent=a.filter(p=>p.role==='Traitor').length;shieldStat.textContent=a.filter(p=>p.shield).length;potStat.textContent=C.g().pot==null?'TBD':'€'+C.g().pot;weekStat.textContent=C.g().week}
function navs(){nav.innerHTML=C.TABS.map(t=>`<button class="btn ${C.state.tab===t?'active':''}" data-tab="${t}">${t}</button>`).join('');nav.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{C.state.tab=b.dataset.tab;C.save();render()})}
function render(){C.shape();stats();navs();gameSelect.value=C.state.current;let t=C.state.tab||'Dashboard';panel.innerHTML=t==='Dashboard'?C.dashboard():t==='Game Plan'?C.gamePlanView():t==='Players'?C.playersView():t==='Player Import'?C.importView():t==='Mission Tools'?C.missionToolsView():t==='Round Table'?C.roundView():t==='Armoury'?C.armouryView():t==='Envelope Board'?C.envelopeBoardView():t==='Wildcards'?C.wildView():t==='Host Notes'?C.notesView():t==='Story Studio'?C.storyStudioView():t==='Game Log'?C.logView():C.shareView();bind()}
function editPlayer(p){modalRoot.innerHTML=`<div class="modalback"><div class="modal"><h2>Edit player</h2><div class="field"><label>Full name</label><input id="pn" class="input" value="${E(p.name)}"></div><div class="field"><label>Private host note</label><input id="ph" class="input" value="${E(p.notes||'')}"></div><label style="display:flex;gap:8px;align-items:center;margin-top:12px"><input id="pd" type="checkbox" ${p.dagger?'checked':''}> Player currently holds the Dagger</label><div class="row"><button class="btn" id="mNo">Cancel</button><button class="btn primary" id="mYes">Save</button></div></div></div>`;mNo.onclick=()=>modalRoot.innerHTML='';mYes.onclick=()=>{p.name=pn.value.trim()||p.name;p.notes=ph.value.trim();p.dagger=pd.checked;C.log(`Player details updated: ${p.name}.`);modalRoot.innerHTML='';render()}}
function transfer(p){let a=C.g().players.filter(x=>x.status==='Alive'&&x.id!==p.id);modalRoot.innerHTML=`<div class="modalback"><div class="modal"><h2>Transfer ${E(p.name)}'s Shield</h2><p class="meta">The recipient cannot already hold a Shield or have held one last week.</p><select id="sr" class="select" style="width:100%"><option value="">Choose player…</option>${a.map(x=>`<option value="${x.id}">${E(x.name)}${C.canReceiveShield(x)?'':' • ineligible'}</option>`).join('')}</select><div class="row"><button class="btn danger" id="rm">Remove Shield</button><button class="btn" id="mNo">Cancel</button><button class="btn primary" id="mYes">Transfer</button></div></div></div>`;mNo.onclick=()=>modalRoot.innerHTML='';rm.onclick=()=>{p.shield=false;p.shieldWeek=null;C.log(`${p.name}'s Shield was removed.`);modalRoot.innerHTML='';render()};mYes.onclick=()=>{let r=C.g().players.find(x=>x.id===sr.value);if(!r)return alert('Choose a player.');if(!C.canReceiveShield(r))return alert(`${r.name} cannot receive a Shield this week because they already hold one or held one last week.`);p.shield=false;p.shieldWeek=null;C.giveShield(r);C.log(`${p.name} transferred their Shield to ${r.name}.`);modalRoot.innerHTML='';render()}}
function tally(){let b=document.getElementById('tally'),g=C.g(),c={};if(!b)return;Object.entries(g.currentVotes).forEach(([voterId,targetId])=>{let voter=g.players.find(p=>p.id===voterId),w=voter?.dagger?2:1;c[targetId]??={count:0,voters:[]};c[targetId].count+=w;c[targetId].voters.push(`${voter?.name||'Unknown'}${w===2?' ×2':''}`)});b.innerHTML=Object.entries(c).sort((a,b)=>b[1].count-a[1].count||String(g.players.find(p=>p.id===a[0])?.name||'').localeCompare(String(g.players.find(p=>p.id===b[0])?.name||''))).map(([id,v])=>`<div class="tally"><div class="tally-main"><b>${E(g.players.find(p=>p.id===id)?.name||'Unknown')}</b><span class="tally-voters">${E(v.voters.join(', '))}</span></div><strong>${v.count}</strong></div>`).join('')||'<div class="notice">No votes recorded yet.</div>'}
function bind(){let g=C.g();if(window.saveGame)saveGame.onclick=()=>{let oldWeek=g.week,newWeek=Math.max(1,+weekInput.value||1);g.week=newWeek;g.pot=potInput.value.trim()===''?null:Math.max(0,+potInput.value||0);g.startingTraitors=Math.max(1,+startingTraitorsInput.value||C.suggestedTraitors());g.finaleMode=finaleModeInput.value==='true';if(newWeek>oldWeek)C.expireShields(newWeek);C.log(`Game settings saved: Week ${g.week}${g.pot!=null?`; pot ${g.pot}`:''}; target starting Traitors ${g.startingTraitors}; Finale mode ${g.finaleMode?'on':'off'}.`);render()};
if(window.resetGame)resetGame.onclick=()=>{modalRoot.innerHTML=`<div class="modalback"><div class="modal"><h2>Reset ${E(g.label)}?</h2><p>This permanently clears the current game's <b>players, votes, notes, logs, missions, wildcard history, Shields, Dagger state and envelope picks</b>.</p><p>The Armoury will be rebuilt fresh with <b>100 envelopes, 20 Shields and 1 Dagger</b>. Game A/B not currently selected will not be touched.</p><div class="field"><label>Type RESET to confirm</label><input id="resetConfirmText" class="input" autocomplete="off" placeholder="RESET"></div><div class="row"><button class="btn" id="mNo">Cancel</button><button class="btn danger" id="mYes">Reset game</button></div></div></div>`;document.getElementById('mNo').onclick=()=>modalRoot.innerHTML='';document.getElementById('mYes').onclick=()=>{if(document.getElementById('resetConfirmText').value.trim().toUpperCase()!=='RESET')return alert('Type RESET to confirm.');const key=C.state.current,label=g.label||`Game ${key}`;C.state.games[key]=C.freshGame(label);C.state.tab='Dashboard';C.save();modalRoot.innerHTML='';render()}};
const addPlayerEl=document.getElementById('addPlayer');if(addPlayerEl)addPlayerEl.onclick=()=>{if(g.players.length>=40)return alert('Maximum 40 players.');modalRoot.innerHTML=`<div class="modalback"><div class="modal"><h2>Add player</h2><div class="field"><label>Full name</label><input id="newPlayerName" class="input" placeholder="Enter player name"></div><div class="row"><button class="btn" id="mNo">Cancel</button><button class="btn primary" id="mYes">Add player</button></div></div></div>`;document.getElementById('mNo').onclick=()=>modalRoot.innerHTML='';document.getElementById('mYes').onclick=()=>{const n=document.getElementById('newPlayerName').value.trim();if(!n)return alert('Enter a player name.');g.players.push({id:crypto.randomUUID(),name:n,role:'Faithful',status:'Alive',shield:false,shieldWeek:null,lastShieldWeek:null,dagger:false,revealedRole:null,notes:''});C.log(`${n} added to the game.`);modalRoot.innerHTML='';C.save();render()}};
if(window.removeDummies)removeDummies.onclick=async()=>{if(await C.modal('Remove unused dummy players?','Only untouched Player XX entries are removed.','Remove')){g.players=g.players.filter(p=>!/^Player \d+$/.test(p.name)||p.status!=='Alive'||p.shield||p.notes);C.log('Unused dummy players removed.');render()}};
panel.querySelectorAll('[data-a]').forEach(b=>b.onclick=async()=>{
  let p=g.players[+b.dataset.i],a=b.dataset.a;
  if(a==='edit')return editPlayer(p);
  if(a==='shield'){
    if(p.shield)return transfer(p);
    if(!C.giveShield(p))return alert(`${p.name} cannot receive a Shield this week because they already hold one or held one last week.`);C.log(`${p.name} received a Shield for Week ${g.week}.`);
  }
  if(a==='role'){p.role=p.role==='Traitor'?'Faithful':'Traitor';C.log(`${p.name} is now a ${p.role}.`)}
  if(a==='restore'){p.status='Alive';p.revealedRole=null;C.log(`${p.name} restored to active play.`)}
  if(a==='murder'){
    if(p.shield){
      p.shield=false;p.shieldWeek=null;C.log(`${p.name} was targeted for murder but survived due to a Shield.`);
      g.share={headline:'A MURDER WAS ATTEMPTED',sub:'The intended victim was protected by a Shield.'};
    }else if(await C.modal('Confirm murder?',`Mark <b>${E(p.name)}</b> as murdered?`,'Murder')){
      p.status='Murdered';C.log(C.story('murder',p)||`${p.name} was murdered.`);
      g.share={headline:'THE TRAITORS HAVE STRUCK',sub:`${p.name} has been murdered.`};
    }
  }
  if(a==='banish'){
    let hide=g.finaleMode,ok=await C.modal(hide?'Confirm Finale banishment?':'Confirm banishment?',hide?`Mark <b>${E(p.name)}</b> as banished. Their role will stay hidden publicly.`:`Mark <b>${E(p.name)}</b> as banished and reveal ${p.role}?`,hide?'Banish • keep role hidden':'Banish');
    if(ok){p.status='Banished';p.shield=false;p.shieldWeek=null;if(hide){p.revealedRole=null;C.log(`${p.name} was banished during the Finale. Their role was not revealed.`);g.share={headline:'BANISHED',sub:`${p.name} has been banished. Their allegiance remains unknown.`}}else{p.revealedRole=p.role;C.log(C.story('banish',p));g.share={headline:'BANISHED',sub:`${p.name} was a ${p.role}.`}}}
  }
  C.save();render();
});
if(window.generateTeams)generateTeams.onclick=async()=>{let alive=[...g.players.filter(p=>p.status==='Alive')],count=Math.max(2,Math.min(8,+teamCount.value||4));if(!alive.length)return alert('No living players.');if(g.missionTeams.length&&!await C.modal('Replace existing mission?', 'This will erase current team assignments, scores and unapplied Gold. Already credited Gold will stay in the pot.','Replace'))return;for(let i=alive.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[alive[i],alive[j]]=[alive[j],alive[i]]}g.teamsPerSession=count;g.missionSessions=[alive.slice(0,16).map(p=>p.id),alive.slice(16,32).map(p=>p.id),alive.slice(32).map(p=>p.id)].filter(x=>x.length);g.missionTeams=[];g.missionSessions.forEach(batch=>{let n=Math.min(count,batch.length),groups=Array.from({length:n},()=>[]);batch.forEach((id,i)=>groups[i%n].push(id));g.missionTeams.push(...groups)});g.missionScores={};g.missionGoldApplied={};C.save();render()};
if(window.savePace)savePace.onclick=()=>{let w=+paceWeek.value,g=C.g();g.paceExtras[w]=Math.max(0,Math.min(5,Math.floor(+paceExtra.value||0)));C.save();render()};
if(window.paceWeek)paceWeek.onchange=()=>{paceExtra.value=C.extraForWeek(+paceWeek.value)};
panel.querySelectorAll('[data-save-score]').forEach(b=>b.onclick=()=>{let i=+b.dataset.saveScore,points=panel.querySelector(`[data-score="${i}"]`).value,gold=panel.querySelector(`[data-gold="${i}"]`).value;if(points===''||gold==='')return alert('Enter both the score and Gold earned.');let a=+points,v=+gold;if(!Number.isFinite(a)||!Number.isFinite(v)||a<0||v<0||a>9999||v>100000)return alert('Enter valid non-negative values.');if(g.missionGoldApplied[i]&&v!==g.missionScores[i]?.gold)return alert('Gold has already been credited. You can still update the score, but cannot change credited Gold.');g.missionScores[i]={points:a,gold:v};C.save();render()});
panel.querySelectorAll('[data-apply-gold]').forEach(b=>b.onclick=()=>{let i=+b.dataset.applyGold,entry=g.missionScores[i];if(!entry||g.missionGoldApplied[i])return;if(g.pot==null)return alert('Set the Gold pot to 0 on the Dashboard first.');g.pot=Number(g.pot)+entry.gold;g.missionGoldApplied[i]=true;C.log(`Team ${i+1} earned ${entry.gold} Gold in Week ${g.week}.`);render()});
if(window.clearTeams)clearTeams.onclick=()=>{g.missionTeams=[];g.missionSessions=[];g.missionScores={};g.missionGoldApplied={};C.save();render()};
const pickFaithful=()=>{let pool=g.players.filter(p=>p.status==='Alive'&&p.role==='Faithful');if(!pool.length)return alert('No living Faithful are available.');let p=pool[Math.floor(Math.random()*pool.length)];g.secretFaithfulSelection=p.id;C.save();render()};
if(window.pickSecretFaithful)pickSecretFaithful.onclick=pickFaithful;
if(window.wildPickFaithful)wildPickFaithful.onclick=pickFaithful;
if(window.clearSecretFaithful)clearSecretFaithful.onclick=()=>{g.secretFaithfulSelection=null;C.save();render()};
if(window.expireShieldsNow)expireShieldsNow.onclick=async()=>{let holders=g.players.filter(p=>p.shield);if(!holders.length)return alert('There are no active Shields.');if(await C.modal('Expire all current Shields?',`This will remove ${holders.length} active Shield${holders.length===1?'':'s'} before the next Challenge.`,'Expire Shields')){holders.forEach(p=>{p.shield=false;p.shieldWeek=null});C.log(`All active Shields expired before the Week ${g.week} Challenge.`);render()}};
if(window.saveRound)saveRound.onclick=()=>{g.round=Math.max(1,+roundNo.value||1);C.save();render()};if(window.consumeDagger)consumeDagger.onclick=async()=>{let holders=g.players.filter(p=>p.status==='Alive'&&p.dagger);if(!holders.length)return;if(await C.modal('Consume Dagger?',`Remove the Dagger from ${holders.map(p=>E(p.name)).join(', ')} now that the double vote has been used?`,'Consume')){holders.forEach(p=>p.dagger=false);C.log('The Dagger was consumed after the Round Table vote.');render()}};
panel.querySelectorAll('[data-env]').forEach(b=>b.onclick=()=>{let x=g.armoury.find(e=>e.num===+b.dataset.env),alive=g.players.filter(p=>p.status==='Alive');if(x.taken){let chooser=g.players.find(p=>p.id===x.chosenBy),recipient=g.players.find(p=>p.id===x.assignedTo);modalRoot.innerHTML=`<div class="modalback"><div class="modal"><h2>Envelope #${x.num}</h2><p><b>Contents:</b> ${E(x.content)}</p><p><b>Chosen by:</b> ${E(chooser?.name||'Unassigned')}</p>${recipient&&recipient.id!==chooser?.id?`<p><b>Assigned to:</b> ${E(recipient.name)}</p>`:''}<p><b>Player informed:</b> ${x.informed?'Yes':'No'}</p><div class="row"><button class="btn" id="mNo">Close</button><button class="btn primary" id="toggleInfo">${x.informed?'Mark not informed':'Mark informed'}</button></div></div></div>`;mNo.onclick=()=>modalRoot.innerHTML='';toggleInfo.onclick=()=>{x.informed=!x.informed;C.save();modalRoot.innerHTML='';render()};return}modalRoot.innerHTML=`<div class="modalback"><div class="modal"><h2>Envelope #${x.num}</h2><p>Host-only contents: <b>${E(x.content)}</b></p><div class="field"><label>Who chose this envelope?</label><select id="chooser" class="select"><option value="">Choose player…</option>${alive.map(p=>`<option value="${p.id}">${E(p.name)}</option>`).join('')}</select></div>${x.content==='Shield'?`<div class="field"><label>Who receives the Shield?</label><select id="recipient" class="select"><option value="">Same player / choose recipient…</option>${alive.map(p=>`<option value="${p.id}">${E(p.name)}${C.canReceiveShield(p)?'':' • ineligible'}</option>`).join('')}</select></div><div class="notice">A player cannot hold a Shield in consecutive weeks. If the chooser is ineligible, pass it to another living player.</div>`:''}<div class="row"><button class="btn" id="mNo">Cancel</button><button class="btn primary" id="mYes">Mark taken</button></div></div></div>`;mNo.onclick=()=>modalRoot.innerHTML='';mYes.onclick=()=>{let chooserPlayer=g.players.find(p=>p.id===chooser.value);if(!chooserPlayer)return alert('Choose who selected the envelope.');let recipientPlayer=chooserPlayer;if(x.content==='Shield'&&recipient.value)recipientPlayer=g.players.find(p=>p.id===recipient.value);if(x.content==='Shield'&&!C.canReceiveShield(recipientPlayer))return alert(`${recipientPlayer.name} cannot receive a Shield this week. Choose another recipient.`);x.taken=true;x.chosenBy=chooserPlayer.id;x.assignedTo=recipientPlayer.id;x.openedWeek=g.week;x.informed=false;if(x.content==='Shield'){C.giveShield(recipientPlayer);C.log(`Envelope #${x.num} was taken. A Shield was assigned privately.`)}else if(x.content==='Dagger'){chooserPlayer.dagger=true;C.log(`Envelope #${x.num} was taken. The Dagger was assigned privately.`)}else C.log(`Envelope #${x.num} was taken.`);modalRoot.innerHTML='';render()}});
panel.querySelectorAll('[data-informed]').forEach(b=>b.onclick=()=>{let x=g.armoury.find(e=>e.num===+b.dataset.informed);if(x){x.informed=!x.informed;C.save();render()}});

if(window.previewCsv){
  let parsedNames=[];
  const parseCsv=async()=>{
    const f=csvFile.files?.[0]; if(!f) throw Error('Choose a CSV file first.');
    const text=await f.text();
    const lines=text.replace(/\r/g,'').split('\n').filter(x=>x.trim()!=='');
    if(!lines.length) throw Error('The CSV is empty.');
    const header=lines[0].replace(/^\uFEFF/,'').trim().replace(/^"|"$/g,'');
    if(header.toLowerCase()!=='name') throw Error('The first column header must be Name.');
    parsedNames=lines.slice(1).map(line=>{let v=line.trim();if(v.startsWith('"')&&v.endsWith('"'))v=v.slice(1,-1).replace(/""/g,'"');return v.trim()}).filter(Boolean);
    parsedNames=[...new Set(parsedNames)];
    if(!parsedNames.length) throw Error('No player names were found.');
    if(parsedNames.length>40) throw Error('Maximum 40 players per game.');
    csvStatus.textContent=`${parsedNames.length} names ready to import.`;
    csvPreview.innerHTML=parsedNames.map(n=>`<article class="player"><h3>${E(n)}</h3><div class="meta">Will be added as Faithful</div></article>`).join('');
    importCsv.disabled=false; appendCsv.disabled=false;
  };
  previewCsv.onclick=async()=>{try{await parseCsv()}catch(e){csvStatus.textContent=e.message;importCsv.disabled=true;appendCsv.disabled=true;csvPreview.innerHTML=''}};
  csvFile.onchange=()=>{importCsv.disabled=true;appendCsv.disabled=true;csvStatus.textContent='File selected. Tap Preview CSV.';csvPreview.innerHTML=''};
  importCsv.onclick=async()=>{
    try{if(!parsedNames.length)await parseCsv(); if(!await C.modal('Replace current roster?',`This will replace all players in ${E(g.label)} with ${parsedNames.length} names from the CSV.`,`Replace roster`))return;
      g.players=parsedNames.map(n=>({id:crypto.randomUUID(),name:n,role:'Faithful',status:'Alive',shield:false,shieldWeek:null,lastShieldWeek:null,dagger:false,revealedRole:null,notes:''}));
      g.currentVotes={}; g.notes=[]; g.share={headline:'THE GAME BEGINS',sub:'Trust no one.'};
      C.log(`Roster imported from CSV: ${parsedNames.length} players.`); render();
    }catch(e){csvStatus.textContent=e.message}
  };
  appendCsv.onclick=async()=>{
    try{
      if(!parsedNames.length)await parseCsv();
      const existing=new Set(g.players.map(p=>p.name.trim().toLowerCase()));
      const add=parsedNames.filter(n=>!existing.has(n.toLowerCase()));
      if(g.players.length+add.length>40) throw Error(`Adding these names would exceed the 40-player maximum. Current roster: ${g.players.length}; new unique names: ${add.length}.`);
      if(!add.length){csvStatus.textContent='All names in this CSV are already on the roster.';return;}
      if(!await C.modal('Add names to current roster?',`Add ${add.length} new player${add.length===1?'':'s'} to ${E(g.label)}? Existing players and game history will be kept.`,`Add players`))return;
      add.forEach(n=>g.players.push({id:crypto.randomUUID(),name:n,role:'Faithful',status:'Alive',shield:false,shieldWeek:null,lastShieldWeek:null,dagger:false,revealedRole:null,notes:''}));
      C.log(`Roster updated from CSV: ${add.length} new player${add.length===1?'':'s'} added.`);
      csvStatus.textContent=`${add.length} new player${add.length===1?'':'s'} added.`; render();
    }catch(e){csvStatus.textContent=e.message}
  };
}
if(window.generateStory){
  let latestStory='';
  const storyMeta=()=>{
    const mode=storyMode.value, scope=storyScope.value, tone=storyTone.value, len=storyLength.value;
    const isHost=mode==='host_story';
    const targetWeek=scope==='previous'?Math.max(1,g.week-1):g.week;
    const scopeLabel=scope==='all'?'the entire game':`Week ${targetWeek}`;
    let task='Write a spoiler-free public recap of the supplied game history.';
    let title='CMS Traitors Recap';
    if(mode==='week_wrap'){task=`Write an END-OF-WEEK WRAP-UP for ${scopeLabel}. Look back on the public turning points, accusations, tension, mission moments, murders and banishments that are actually supported by the supplied data. Make it feel like the closing narration of an episode. Finish with unresolved suspicion or a question that carries tension into the next week.`;title=`Week ${targetWeek} Wrap-Up`;}
    if(mode==='week_opener'){task=`Write a START-OF-WEEK RECAP AND TEASER. Briefly remind the players what publicly happened in ${scope==='current'?`the game up to Week ${g.week}`:scopeLabel}, then pivot forward and set the tone for Week ${g.week}. Create anticipation and tension around unresolved public suspicions without inventing evidence, revealing secret roles, or predicting who will be murdered/banished.`;title=`Week ${g.week} Begins`;}
    if(mode==='host_story'){task=`Write a private Host-only season narrative using ${scopeLabel}. Connect events across the supplied notes and logs, including secret information where useful.`;title='Host Season Storyline';}
    const toneText=tone==='tense'?'Keep the tone tense, cinematic and suspicious.':tone==='playful'?'Keep the tone playful, dryly funny and suspicious without becoming silly.':'Keep the tone balanced: dramatic but natural.';
    const lengthText=len==='short'?'Keep it very concise, roughly 1-2 short paragraphs.':len==='long'?'Make it a fuller dramatic recap, roughly 4-6 paragraphs.':'Aim for roughly 2-4 paragraphs.';
    return {mode,scope,tone,len,isHost,targetWeek,scopeLabel,task,title,direction:`${task} ${toneText} ${lengthText}${storyDirection.value.trim()?` Director note: ${storyDirection.value.trim()}`:''}`};
  };
  const runStory=async()=>{
    storyStatus.textContent='Generating…'; generateStory.disabled=true; generateAgain.disabled=true; addStoryToLog.disabled=true; copyStory.disabled=true;
    try{
      const session=C.auth.session(); if(!session?.access_token) throw Error('Your Host session has expired. Sign in again.');
      const meta=storyMeta();
      const secretPattern=/(received a Shield|transferred their Shield|Shield was removed|Shield protection|is now a Traitor|is now a Faithful|Envelope #|Armoury rebuilt|Wildcard activated|Player details updated|restored to active play|target starting Traitors|Finale mode)/i;
      let logSource=meta.isHost?g.log:g.log.filter(x=>!secretPattern.test(x.text||''));
      let notesSource=(meta.isHost?g.notes:g.notes.filter(n=>n.visibility==='public')).slice();
      if(meta.scope!=='all'){
        notesSource=notesSource.filter(n=>Number(n.week||0)===meta.targetWeek);
        logSource=logSource.filter(x=>Number(x.week||0)===meta.targetWeek);
      }
      notesSource=notesSource.sort((a,b)=>(a.date||'').localeCompare(b.date||'')||(a.ts||'').localeCompare(b.ts||''));
      logSource=logSource.slice().reverse();
      const payload={mode:meta.isHost?'host':'public',gameName:g.label,direction:meta.direction,notes:notesSource,events:logSource,publicPlayerState:g.players.map(p=>({name:p.name,status:p.status,revealedRole:p.status==='Banished'?p.revealedRole:null})),length:meta.len,week:g.week,pot:g.pot};
      const r=await fetch('https://icmswuaidofxxdqiovsj.supabase.co/functions/v1/cms-storyline',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+session.access_token,'apikey':'sb_publishable_vk6oqfLo2cClWhbHReLKJQ_oaLamxF8'},body:JSON.stringify(payload)});
      const data=await r.json().catch(()=>({})); if(!r.ok) throw Error(data.error||data.message||`HTTP ${r.status}`);
      latestStory=(data.story||data.text||'').trim();
      storyOutput.textContent=latestStory||'No story returned.';storyTitle.textContent=meta.title;storyBadge.textContent=meta.isHost?'Host-only storyline':'Public-safe recap';storyStatus.textContent=`Generated using ${notesSource.length} note${notesSource.length===1?'':'s'} and ${logSource.length} timeline event${logSource.length===1?'':'s'} from ${meta.scopeLabel}.`;
      addStoryToLog.disabled=!latestStory;copyStory.disabled=!latestStory;generateAgain.disabled=false;
    }catch(e){storyStatus.textContent='AI generation unavailable: '+e.message;} finally{generateStory.disabled=false}
  };
  generateStory.onclick=runStory;generateAgain.onclick=runStory;
  copyStory.onclick=async()=>{if(!latestStory)return;try{await navigator.clipboard.writeText(latestStory);storyStatus.innerHTML='<span class="copy-ok">Copied. Ready to paste into Teams.</span>'}catch{let ta=document.createElement('textarea');ta.value=latestStory;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove();storyStatus.innerHTML='<span class="copy-ok">Copied. Ready to paste into Teams.</span>'}};
  addStoryToLog.onclick=()=>{if(latestStory){C.log(`[Storyline] ${latestStory}`);storyStatus.textContent='Saved to Storyline Log.'}};
}
